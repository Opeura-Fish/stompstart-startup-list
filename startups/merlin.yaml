name: Merlin
tagline: Coding agents that run inside the tools a team already uses
description: >-
  Merlin runs Claude Code and Codex for a team, started from the apps the team
  already works in. A request can come from Slack, Linear or GitHub, and the
  agent runs on a machine the team controls rather than on a vendor's servers.
  Every run appears in a shared view, so teammates can follow progress, read
  what the agent produced and step in when a run needs help. The web app keeps
  setup, run history and connection status for the machines involved.
problem: A coding agent runs on one person's machine, so the rest of the team cannot see it or steer it.
audience:
  - Product and engineering teams
  - Teams running coding agents at work
